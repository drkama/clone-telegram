<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jumagram Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Inter', sans-serif; }
  body { background:#0e0a1a; color:#fff; padding:20px; }
  .container { max-width:800px; margin:0 auto; background:#140d24; border-radius:16px; padding:20px; border:1px solid rgba(168,85,247,0.2); }
  h1 { color:#d946ef; font-size:24px; margin-bottom:20px; text-align:center; }
  table { width:100%; border-collapse:collapse; }
  th, td { padding:12px; text-align:left; border-bottom:1px solid rgba(168,85,247,0.2); font-size:14px; }
  th { color:#a855f7; }
  button { background:#ef4444; color:#fff; border:none; padding:6px 12px; border-radius:6px; cursor:pointer; }
</style>
</head>
<body>
<div class="container">
  <h1>Jumagram Admin</h1>
  <table>
    <thead><tr><th>Пользователь</th><th>Статус</th><th>Действие</th></tr></thead>
    <tbody id="usersTable"></tbody>
  </table>
</div>
<script>
  async function load() {
    const res = await fetch('/api/admin/users');
    const users = await res.json();
    document.getElementById('usersTable').innerHTML = users.map(u => `
      <tr>
        <td>@${u.username}</td>
        <td>${u.online ? '<span style="color:#10b981">В сети</span>' : 'Оффлайн'}</td>
        <td><button onclick="del('${u.username}')">Удалить</button></td>
      </tr>
    `).join('');
  }
  async function del(u) {
    if(!confirm(`Удалить @${u}?`)) return;
    await fetch('/api/admin/delete', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ username: u }) });
    load();
  }
  load();
</script>
</body>
</html>
