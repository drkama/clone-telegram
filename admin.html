<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jumagram Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Inter', sans-serif; }
  body { background:#0e0a1a; color:#fff; padding:20px; }
  .container { max-width:900px; margin:0 auto; background:#140d24; border-radius:16px; padding:20px; border:1px solid rgba(168,85,247,0.2); }
  h1 { color:#d946ef; font-size:24px; margin-bottom:20px; text-align:center; }
  .tabs { display:flex; gap:10px; margin-bottom:20px; }
  .tab-btn { flex:1; background:#1a0f2e; color:#7f91a4; border:1px solid #3b2b52; padding:12px; border-radius:10px; cursor:pointer; font-weight:500; transition:0.2s; }
  .tab-btn.active { background:linear-gradient(135deg, #7c3aed, #d946ef); color:#fff; border-color:transparent; }
  .section { display:none; }
  .section.active { display:block; }
  table { width:100%; border-collapse:collapse; margin-bottom:20px; }
  th { text-align:left; padding:12px; border-bottom:1px solid rgba(168,85,247,0.2); color:#a855f7; font-size:13px; text-transform:uppercase; }
  td { padding:12px; border-bottom:1px solid rgba(255,255,255,0.05); font-size:14px; vertical-align:middle; }
  tr:hover td { background:rgba(168,85,247,0.05); }
  button.del { background:rgba(239,68,68,0.1); color:#ef4444; border:1px solid rgba(239,68,68,0.3); padding:6px 12px; border-radius:6px; cursor:pointer; font-size:12px; transition:0.2s; }
  button.del:hover { background:#ef4444; color:#fff; }
  .badge { background:rgba(168,85,247,0.2); color:#d946ef; padding:3px 8px; border-radius:12px; font-size:11px; font-weight:600; }
</style>
</head>
<body>
<div class="container">
  <h1>Jumagram Admin</h1>
  <div class="tabs">
    <button class="tab-btn active" onclick="showTab('users', this)">Пользователи</button>
    <button class="tab-btn" onclick="showTab('messages', this)">Сообщения</button>
  </div>

  <div id="users" class="section active">
    <table><thead><tr><th>Пользователь</th><th>Роль</th><th>Был в сети</th><th>Действие</th></tr></thead><tbody id="usersTable"></tbody></table>
  </div>

  <div id="messages" class="section">
    <table><thead><tr><th>От</th><th>Кому</th><th>Текст</th><th>Время</th><th>Удалить</th></tr></thead><tbody id="messagesTable"></tbody></table>
  </div>
</div>

<script>
  async function loadData() {
    const res = await fetch('/api/admin/data');
    const data = await res.json();

    document.getElementById('usersTable').innerHTML = data.users.map(u => `
      <tr>
        <td>@${u.username}</td>
        <td>${u.is_admin ? '<span class="badge">Админ</span>' : 'Юзер'}</td>
        <td>${u.last_seen}</td>
        <td><button class="del" onclick="deleteUser('${u.username}')">Удалить</button></td>
      </tr>
    `).join('');

    document.getElementById('messagesTable').innerHTML = data.messages.map(m => `
      <tr>
        <td>@${m.from_user}</td>
        <td>@${m.to_user}</td>
        <td>${m.text}</td>
        <td>${m.time}</td>
        <td><button class="del" onclick="deleteMessage(${m.id})">X</button></td>
      </tr>
    `).join('');
  }

  async function deleteUser(username) {
    if (!confirm(`Удалить @${username}?`)) return;
    await fetch('/api/admin/delete-user', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ username }) });
    loadData();
  }

  async function deleteMessage(id) {
    if (!confirm(`Удалить сообщение?`)) return;
    await fetch('/api/admin/delete-message', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ id }) });
    loadData();
  }

  function showTab(id, btn) {
    document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    btn.classList.add('active');
  }

  loadData();
</script>
</body>
</html>
