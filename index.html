<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jumagram</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:-apple-system, 'Segoe UI', Roboto, sans-serif; }
  body { 
    background: radial-gradient(circle at 30% 20%, #1a0f2e 0%, #0e0a1a 60%, #080510 100%);
    display:flex; justify-content:center; align-items:center; height:100vh; 
    color:#fff;
  }

  /* Экран входа */
  .login {
    background: rgba(30, 18, 50, 0.75);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(168, 85, 247, 0.2);
    padding:32px; border-radius:20px; width:340px;
    display:flex; flex-direction:column; gap:14px; color:#fff;
    box-shadow: 0 10px 40px rgba(120, 40, 200, 0.25), inset 0 0 20px rgba(168, 85, 247, 0.05);
  }
  .login h2 { 
    text-align:center; margin-bottom:8px; 
    background: linear-gradient(90deg, #c084fc, #e879f9, #a855f7);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    font-size: 28px; letter-spacing: 1.5px; font-weight: 700;
    filter: drop-shadow(0 0 10px rgba(217, 70, 239, 0.4));
  }
  .login input {
    background: rgba(20, 12, 35, 0.8);
    border: 1px solid rgba(168, 85, 247, 0.2);
    border-radius:12px; padding:12px 14px; color:#fff; outline:none; font-size:14px;
    transition: .2s;
  }
  .login input::placeholder { color:#8b6bb0; }
  .login input:focus { border-color:#a855f7; box-shadow: 0 0 10px rgba(168, 85, 247, 0.3); }
  .login button {
    background: linear-gradient(135deg, #7c3aed, #a855f7, #d946ef);
    color:#fff; border:none; border-radius:12px;
    padding:12px; font-size:15px; font-weight: 600; cursor:pointer; 
    transition:.2s; margin-top: 4px;
    box-shadow: 0 4px 15px rgba(168, 85, 247, 0.4);
  }
  .login button:hover { 
    transform: translateY(-1px);
    box-shadow: 0 6px 20px rgba(217, 70, 239, 0.5);
  }
  .login .err { color:#f87171; font-size:13px; text-align:center; }

  /* Приложение */
  .app {
    width:1000px; height:700px;
    background: rgba(20, 12, 35, 0.85);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(168, 85, 247, 0.15);
    border-radius:20px; display:none; overflow:hidden;
    box-shadow: 0 0 50px rgba(120, 40, 200, 0.3);
  }
  .app.show { display:flex; }

  /* Сайдбар */
  .sidebar {
    width:300px; 
    background: rgba(16, 9, 28, 0.6);
    border-right: 1px solid rgba(168, 85, 247, 0.15);
    display:flex; flex-direction:column;
  }
  .sidebar-header {
    padding:16px; border-bottom:1px solid rgba(168, 85, 247, 0.15);
    color:#e9d5ff; font-size:15px; font-weight: 600;
    display:flex; justify-content:space-between; align-items:center;
  }
  .logout { 
    background:none; border:none; color:#9d7ac0; cursor:pointer; font-size:13px;
    transition: .2s;
  }
  .logout:hover { color:#e879f9; }
  .chat-list { flex:1; overflow-y:auto; }

  .chat-item {
    display:flex; align-items:center; padding:12px 16px; gap:12px;
    cursor:pointer; transition:.2s;
    border-left: 3px solid transparent;
  }
  .chat-item:hover { background: rgba(168, 85, 247, 0.08); }
  .chat-item.active { 
    background: linear-gradient(90deg, rgba(168, 85, 247, 0.2), transparent);
    border-left-color: #d946ef;
  }

  .avatar {
    width:44px; height:44px; border-radius:50%;
    background: linear-gradient(135deg, #7c3aed, #d946ef);
    display:flex; align-items:center; justify-content:center; color:#fff;
    font-weight:bold; font-size:16px; flex-shrink:0;
    box-shadow: 0 0 12px rgba(168, 85, 247, 0.4);
  }
  .chat-name { color:#f3e8ff; font-size:15px; font-weight: 500; }
  .status { font-size:12px; color:#8b6bb0; }
  .status.on { color:#a3e635; text-shadow: 0 0 6px rgba(163, 230, 53, 0.5); }

  /* Окно чата */
  .chat-window { flex:1; display:flex; flex-direction:column; }
  .chat-header {
    padding:12px 20px; 
    background: rgba(25, 15, 45, 0.6);
    border-bottom:1px solid rgba(168, 85, 247, 0.15);
    display:flex; align-items:center; gap:12px; color:#fff;
  }
  .chat-header .avatar { width:38px; height:38px; font-size:15px; }
  .chat-header h3 { font-size:16px; font-weight:500; color:#f3e8ff; }
  .chat-header p { font-size:12px; color:#a78bfa; }

  .messages { 
    flex:1; padding:20px; overflow-y:auto; 
    display:flex; flex-direction:column; gap:8px;
    background: radial-gradient(circle at 70% 30%, rgba(88, 28, 135, 0.15) 0%, transparent 70%);
  }
  .message {
    max-width:60%; padding:10px 14px; border-radius:16px; font-size:14px;
    line-height:1.4; word-wrap:break-word; color:#fff;
    animation: pop 0.2s ease;
  }
  @keyframes pop { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }

  .message.in {
    background: rgba(45, 28, 72, 0.9);
    border: 1px solid rgba(168, 85, 247, 0.15);
    align-self:flex-start; border-bottom-left-radius:4px;
  }
  .message.out {
    background: linear-gradient(135deg, #7c3aed, #a855f7);
    align-self:flex-end; border-bottom-right-radius:4px;
    box-shadow: 0 4px 15px rgba(124, 58, 237, 0.3);
  }
  .message .time { font-size:10px; color:rgba(255,255,255,0.6); margin-left:8px; float:right; margin-top:4px; }

  /* Ввод */
  .input-area {
    padding:14px 20px; 
    background: rgba(20, 12, 35, 0.8);
    border-top: 1px solid rgba(168, 85, 247, 0.1);
    display:flex; gap:12px;
  }
  .input-area input {
    flex:1; 
    background: rgba(35, 22, 55, 0.9);
    border: 1px solid rgba(168, 85, 247, 0.15);
    border-radius:24px; padding:10px 18px; color:#fff; outline:none; font-size:14px;
    transition: .2s;
  }
  .input-area input::placeholder { color:#8b6bb0; }
  .input-area input:focus { border-color:#a855f7; box-shadow: 0 0 12px rgba(168, 85, 247, 0.2); }
  
  .send-btn {
    background: linear-gradient(135deg, #7c3aed, #d946ef);
    border:none; border-radius:50%; width:42px; height:42px;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    color:#fff; font-size:18px;
    transition: .2s; box-shadow: 0 0 15px rgba(217, 70, 239, 0.4);
  }
  .send-btn:hover { transform: scale(1.05); box-shadow: 0 0 25px rgba(217, 70, 239, 0.6); }

  .empty { flex:1; display:flex; align-items:center; justify-content:center; color:#8b6bb0; font-size:14px; }

  /* Скроллбар */
  ::-webkit-scrollbar { width:6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(168, 85, 247, 0.3); border-radius:3px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(168, 85, 247, 0.5); }

  @media (max-width: 700px) {
    .app { width:100%; height:100vh; border-radius:0; flex-direction: column; }
    .sidebar { width:100%; height: 40%; border-right: none; border-bottom: 1px solid rgba(168, 85, 247, 0.15); }
    .chat-window { height: 60%; }
    .login { width: 90%; }
  }
</style>
</head>
<body>
<div class="login" id="login">
  <h2>Jumagram</h2>
  <input id="username" placeholder="Юзернейм (например, anna)" maxlength="20">
  <input id="password" type="password" placeholder="Пароль" maxlength="30">
  <button id="enterBtn">Войти / Зарегистрироваться</button>
  <div class="err" id="err"></div>
</div>

<div class="app" id="app">
  <div class="sidebar">
    <div class="sidebar-header">
      <span id="myName"></span>
      <button class="logout" id="logoutBtn">Выйти</button>
    </div>
    <div class="chat-list" id="chatList"></div>
  </div>
  <div class="chat-window">
    <div class="chat-header" id="chatHeader" style="display:none;">
      <div class="avatar" id="chatAvatar"></div>
      <div>
        <h3 id="chatName"></h3>
        <p id="chatStatus"></p>
      </div>
    </div>
    <div class="messages" id="messages"></div>
    <div class="input-area" id="inputArea" style="display:none;">
      <input id="messageInput" placeholder="Написать сообщение...">
      <button class="send-btn" id="sendBtn">➤</button>
    </div>
    <div class="empty" id="empty">Выберите чат</div>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
let socket, me = null, currentTo = null;
const usersOnline = new Set();
const history = [];
const $ = id => document.getElementById(id);

$('enterBtn').onclick = () => {
  const username = $('username').value.trim().toLowerCase();
  const password = $('password').value;
  $('err').textContent = '';

  socket = io();
  socket.on('connect', () => {
    socket.emit('register', { username, password }, (res) => {
      if (res.error) { $('err').textContent = res.error; socket.disconnect(); return; }
      me = res.username;
      res.history.forEach(m => history.push(m));
      $('login').style.display = 'none';
      $('app').classList.add('show');
      $('myName').textContent = '@' + me;
      renderUsers();
      bindSocket();
    });
  });
};

function bindSocket() {
  socket.on('users', (list) => {
    usersOnline.clear();
    list.forEach(u => { if (u !== me) usersOnline.add(u); });
    renderUsers();
    if (currentTo) updateHeader();
  });

  socket.on('message', (msg) => {
    history.push(msg);
    if ((msg.from === currentTo && msg.to === me) || (msg.from === me && msg.to === currentTo)) {
      renderMessages();
    }
  });
}

function renderUsers() {
  const list = $('chatList');
  list.innerHTML = '';
  if (usersOnline.size === 0) {
    list.innerHTML = '<div style="padding:20px;color:#8b6bb0;font-size:13px;text-align:center;">Пока никого нет онлайн.<br>Попросите друга зарегистрироваться.</div>';
    return;
  }
  [...usersOnline].sort().forEach(user => {
    const div = document.createElement('div');
    div.className = 'chat-item' + (user === currentTo ? ' active' : '');
    div.innerHTML = `
      <div class="avatar">${user[0].toUpperCase()}</div>
      <div>
        <div class="chat-name">@${user}</div>
        <div class="status on">в сети</div>
      </div>`;
    div.onclick = () => openChat(user);
    list.appendChild(div);
  });
}

function openChat(user) {
  currentTo = user;
  $('chatHeader').style.display = 'flex';
  $('inputArea').style.display = 'flex';
  $('empty').style.display = 'none';
  updateHeader();
  renderMessages();
  renderUsers();
}

function updateHeader() {
  $('chatAvatar').textContent = currentTo[0].toUpperCase();
  $('chatName').textContent = '@' + currentTo;
  $('chatStatus').textContent = usersOnline.has(currentTo) ? 'в сети' : 'не в сети';
}

function renderMessages() {
  const box = $('messages');
  box.innerHTML = '';
  history
    .filter(m => (m.from === me && m.to === currentTo) || (m.from === currentTo && m.to === me))
    .forEach(m => {
      const div = document.createElement('div');
      div.className = 'message ' + (m.from === me ? 'out' : 'in');
      div.innerHTML = `${escapeHtml(m.text)}<span class="time">${m.time}</span>`;
      box.appendChild(div);
    });
  box.scrollTop = box.scrollHeight;
}

function escapeHtml(t) {
  return t.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function send() {
  const text = $('messageInput').value.trim();
  if (!text || !currentTo) return;
  socket.emit('message', { to: currentTo, text });
  $('messageInput').value = '';
}

$('sendBtn').onclick = send;
$('messageInput').addEventListener('keypress', e => { if (e.key === 'Enter') send(); });
$('logoutBtn').onclick = () => location.reload();
</script>
</body>
     </html>
